<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araya Consulting | OmniStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d9488;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-2xl mx-auto my-8 bg-white p-6 rounded-2xl shadow-md">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-teal-600 rounded-full inline-block"></span>
                <h1 class="text-xl font-bold text-gray-800">Araya Consulting | OmniStudio</h1>
            </div>
            <span class="text-teal-600 font-semibold text-sm bg-teal-50 px-3 py-1 rounded-full">V4.5 Stabil</span>
        </div>

        <form id="studioForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">① UNGGAH FOTO PRODUK MENTAH</label>
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center bg-gray-50 hover:bg-gray-100 transition relative">
                    <input type="file" id="productImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required>
                    <div id="uploadPlaceholder" class="space-y-2">
                        <p class="text-gray-500 text-sm">Ketuk untuk memilih atau seret foto produk ke sini</p>
                    </div>
                    <img id="imagePreview" class="hidden max-h-64 mx-auto rounded-lg shadow-sm" alt="Preview">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">② JENIS / KATEGORI PRODUK</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="border p-3 rounded-xl flex items-center space-x-2 cursor-pointer hover:bg-teal-50 transition">
                        <input type="radio" name="category" value="kuliner" checked>
                        <span class="text-sm text-gray-700">🍜 Kuliner & Minuman</span>
                    </label>
                    <label class="border p-3 rounded-xl flex items-center space-x-2 cursor-pointer hover:bg-teal-50 transition">
                        <input type="radio" name="category" value="fashion">
                        <span class="text-sm text-gray-700">👕 Fashion & Pakaian</span>
                    </label>
                    <label class="border p-3 rounded-xl flex items-center space-x-2 cursor-pointer hover:bg-teal-50 transition">
                        <input type="radio" name="category" value="skincare">
                        <span class="text-sm text-gray-700">🧴 Skincare / Kosmetik</span>
                    </label>
                    <label class="border p-3 rounded-xl flex items-center space-x-2 cursor-pointer hover:bg-teal-50 transition">
                        <input type="radio" name="category" value="umum">
                        <span class="text-sm text-gray-700">📦 Produk Umum / Lainnya</span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">③ TEMA LATAR</label>
                    <select id="themePrompt" class="w-full border p-3 rounded-xl bg-white text-sm">
                        <option value="luxury marble studio background with premium lighting">Luxury (Marmer/Mewah)</option>
                        <option value="wooden table studio background with soft warm lighting">Nature (Daun & Alam)</option>
                        <option value="minimalist clean white studio background">Minimalist (Putih Bersih)</option>
                        <option value="dark elegant podium studio background">Dark Elegant (Gelap Elegan)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">④ PENCAHAYAAN</label>
                    <select id="lighting" class="w-full border p-3 rounded-xl bg-white text-sm">
                        <option value="bright studio lighting">Bright / Terang Bersih</option>
                        <option value="soft cinematic warm light">Warm / Sinematik Hangat</option>
                        <option value="dramatic side lighting with shadows">Dramatic / Bayangan Tegas</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-teal-800 text-white font-bold p-4 rounded-xl flex items-center justify-center space-x-2 shadow-md">
                <span>⚡ Mulai Sulap Foto AI</span>
            </button>
        </form>

        <div id="outputSection" class="hidden mt-8 border-t pt-6 space-y-6">
            <h2 class="text-lg font-bold text-gray-800">✨ HASIL SULAPAN OMNISTUDIO</h2>
            <div class="border rounded-2xl overflow-hidden bg-gray-50 p-4 flex justify-center shadow-inner">
                <img id="resultImage" class="max-h-96 rounded-xl shadow" alt="Hasil Render">
            </div>
            <div>
                <h3 class="text-sm font-bold text-gray-700 mb-2">📝 CAPTION PROMOSI PREMIUM (AI)</h3>
                <textarea id="resultCaption" rows="6" class="w-full border p-4 rounded-xl bg-gray-50 font-mono text-sm text-gray-800" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        const productImageInput = document.getElementById('productImage');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const studioForm = document.getElementById('studioForm');
        const submitBtn = document.getElementById('submitBtn');
        const outputSection = document.getElementById('outputSection');
        const resultImage = document.getElementById('resultImage');
        const resultCaption = document.getElementById('resultCaption');

        productImageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadPlaceholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        studioForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="loading-spinner"></div>
                <span class="ml-2">Sedang Memproses Gambar & Merender AI...</span>
            `;

            const selectedTheme = document.getElementById('themePrompt').value;
            const selectedLighting = document.getElementById('lighting').value;
            const combinedPrompt = `${selectedTheme}, ${selectedLighting}`;
            const file = productImageInput.files[0];

            // Mengonversi file ke Base64 dengan aman di sisi frontend
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = async function() {
                const base64String = reader.result;

                try {
                    const response = await fetch('/.netlify/functions/generate-photo', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: base64String,
                            backgroundPrompt: combinedPrompt
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Terjadi penolakan pada server Photoroom.');
                    }

                    resultImage.src = data.image;
                    
                    const activeCategory = document.querySelector('input[name="category"]:checked').value;
                    resultCaption.value = generateClientCaption(activeCategory);

                    outputSection.classList.remove('hidden');
                    outputSection.scrollIntoView({ behavior: 'smooth' });

                } catch (error) {
                    alert('Gangguan sistem: ' + error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>⚡ Mulai Sulap Foto AI</span>`;
                }
            };
        });

        function generateClientCaption(category) {
            const hashtags = "\n\n#ArayaOmniStudio #BisnisKuliner #MarketingAI #FotoProdukPremium";
            if (category === 'kuliner') {
                return "Rasa premium, penampilan bintang lima! ✨\n\nSetiap porsi dibuat dari bahan pilihan terbaik untuk memanjakan lidah Anda. Cocok menemani momen spesial atau sekadar melepaskan penat hari ini.\n\n🎯 Pesan sekarang via tautan di bio kami!" + hashtags;
            } else if (category === 'skincare') {
                return "Pancarkan kilau sehat alami kulit impian Anda setiap hari. ✨\n\nFormulasi khusus yang ringan, cepat meresap, dan menutrisi langsung ke lapisan terdalam.\n\n🛍️ Dapatkan produk aslinya klik link di bio!" + hashtags;
            } else {
                return "Kualitas terbaik yang siap menunjang aktivitas harian Anda dengan maksimal. 👍\n\nDidesain modern, tahan lama, dan fungsional.\n\n🔥 Stok terbatas! Amankan pesanan Anda sekarang juga melalui link di bio." + hashtags;
            }
        }
    </script>
</body>
</html>
